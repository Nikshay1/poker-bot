[project]
name = "pokerbot"
version = "0.1.0"
description = "Heads-up No-Limit Hold'em decision bot: a heuristic advisor plus a CFR river solver"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1",
    "numba>=0.68,<0.69",
]

[project.scripts]
pokerbot = "pokerbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "phevaluator>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokerbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exhaustive checks, run with `pytest -m slow`"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# int(round(x)) is kept explicit because x is often a NumPy scalar.
ignore = ["RUF046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408"]
"scripts/*" = ["C408"]
